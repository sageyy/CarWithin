      - name: Apply 150AURA media-validation patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('App/PxcConnection.swift')
          lines = p.read_text().split('\n')
          out, i, patched = [], 0, False
          while i < len(lines):
              line = lines[i]
              if 'codec == 0 || codec == 2 else' in line:
                  assert out and '(240...1920).contains(width)' in out[-1], 'guard 首行未找到'
                  out.pop()
                  out.append('        guard (16...4096).contains(width), (16...2160).contains(height),')
                  out.append(line.replace('(1...60).contains(fps), codec == 0 || codec == 2 else',
                                          '(0...240).contains(fps) else'))
                  i += 1
                  assert 'protocolFailure' in lines[i], 'throw 行未找到'
                  out.append('            throw TailingError.protocolFailure("春风媒体参数 \\(width)×\\(height)@\\(fps)fps codec=\\(codec) 不受支持")')
                  i += 1
                  assert lines[i].strip() == '}', '右括号未找到'
                  out.append(lines[i])
                  i += 1
                  assert 'return MediaSize' in lines[i], 'return 行未找到'
                  out.append('        return MediaSize(width: width & ~0xF, height: height & ~0xF,')
                  out.append('                         fps: (1...120).contains(fps) ? fps : 30)')
                  i += 1
                  patched = True
                  continue
              out.append(line)
              i += 1
          assert patched, '补丁目标未找到：源码版本可能不匹配'
          p.write_text('\n'.join(out))
          print('150AURA patch applied')
          PY

      - name: Restore accessory identity from official 1.0.5 IPA
        run: |
          curl -sSL -o official.ipa \
            https://github.com/xmz28/CarWithin/releases/download/v1.0.5/CarWithin-1.0.5-unsigned.ipa
          mkdir -p App/BundledIdentity
          unzip -o -j official.ipa \
            'Payload/TDSCarKit.app/certificate.p7b' \
            'Payload/TDSCarKit.app/leaf.cer' \
            'Payload/TDSCarKit.app/private.x963' \
            -d App/BundledIdentity
          ls -l App/BundledIdentity

      - name: Generate Xcode project
        # 与官方 1.0.5 IPA 的 CFBundleIdentifier 保持一致，签名安装后等同于官方那个 App。
        run: TDS_BUNDLE_IDENTIFIER=com.hanlinzhou.SameDeviceCarPlayPoC python3 Tools/generate_project.py

      - name: Build unsigned IPA
        run: |
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit \
            -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/source
          mkdir -p Payload
          cp -R build/source/Build/Products/Release-iphoneos/TDSCarKit.app Payload/
          zip -qr CarWithin-1.0.6-zhangxue.ipa Payload
          ls -lh CarWithin-1.0.6-zhangxue.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-1.0.6-zhangxue
          path: CarWithin-1.0.6-zhangxue.ipa
          if-no-files-found: error
