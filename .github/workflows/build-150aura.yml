name: Build CarWithin 1.0.25 (张雪 500RR/820RR/820R + 崩溃诊断)

# 当前仓库源码已包含张雪 1.0.25 / 150AURA 补丁、连接保持和崩溃诊断。
# 在 Actions 页手动 Run workflow。
# 产物：CarWithin-1.0.25.ipa，下载后自行签名安装。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore accessory identity from official 1.0.5 IPA
        run: |
          curl -sSL -o official.ipa \
            https://github.com/xmz28/CarWithin/releases/download/v1.0.5/CarWithin-1.0.5-unsigned.ipa
          mkdir -p App/BundledIdentity
          unzip -o -j official.ipa \
            'Payload/TDSCarKit.app/certificate.p7b' \
            'Payload/TDSCarKit.app/leaf.cer' \
            'Payload/TDSCarKit.app/private.x963' \
            -d App/BundledIdentity
          ls -l App/BundledIdentity

      - name: Generate Xcode project
        # 与官方 1.0.5 IPA 的 CFBundleIdentifier 保持一致，签名安装后等同于官方那个 App。
        run: TDS_BUNDLE_IDENTIFIER=com.hanlinzhou.SameDeviceCarPlayPoC python3 Tools/generate_project.py

      - name: Build unsigned IPA
        run: |
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit \
            -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/source
          mkdir -p Payload
          cp -R build/source/Build/Products/Release-iphoneos/TDSCarKit.app Payload/
          zip -qr CarWithin-1.0.25.ipa Payload
          ls -lh CarWithin-1.0.25.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-1.0.25
          path: CarWithin-1.0.25.ipa
          if-no-files-found: error
